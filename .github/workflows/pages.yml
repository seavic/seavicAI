name: Build and Deploy GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Setup pnpm
        run: corepack enable && corepack prepare pnpm@11.9.0 --activate
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Scan claims
        run: pnpm run claims:scan
      - name: Build
        run: pnpm run build
      - name: Check links
        run: pnpm run links:check
      - name: Check release content
        run: node tests/check-release.mjs
      - name: Upload artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
